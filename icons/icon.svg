        d="M1.2 8.4 Q2.6 7.4 4 8.4 L6.4 10.9 Q9.8 4.6 16.2 0.4 Q11.2 5.6 7.4 14 Q6.6 15.6 5.4 14.6 Q3.2 11.6 1.2 8.4 Z"
        fill="#1D3B2F" stroke="#f8ede0" stroke-width="0.7" stroke-linejoin="round" paint-order="stroke"/>
</svg>

<!doctype html><html><head><title>Test form</title></head><body>
<!-- Step bar like the UKVI forms: the current step is only shown in bold -->
<style>.steps{list-style:none;display:flex;gap:16px}.steps a{font-weight:400}.steps li:nth-child(2) a{font-weight:700}</style>
<nav><ol class="steps"><li><a href="#">1. Start</a></li><li><a href="#">2. Application</a></li><li><a href="#">3. Finance</a></li><li><a href="#">4. Documents</a></li></ol></nav>
<span class="govuk-caption-l">Section 1 of 3</span>
<h1>Applicant details</h1>
<form>
<div><label for="gn">First name</label><input id="gn" name="gn"></div>
<div><label for="fn">Family name <span>(optional)</span></label><input id="fn" name="fn"></div>
<fieldset><legend>Date of birth</legend>
 <label for="d">Day</label><input id="d" name="d" maxlength="2">
 <label for="m">Month</label><input id="m" name="m" maxlength="2">
 <label for="y">Year</label><input id="y" name="y" maxlength="4"></fieldset>
<div><label for="nat">Nationality</label><select id="nat"><option value="">Choose</option><option>Examplestan</option><option>Otherland</option></select></div>
<fieldset><legend>Do you have a passport?</legend>
 <input type="radio" name="pp" id="pp1" value="y"><label for="pp1">Yes</label>
 <input type="radio" name="pp" id="pp2" value="n"><label for="pp2">No</label></fieldset>
<div><label for="ppn">Passport number</label><input id="ppn"></div>
<fieldset><legend>Your representative</legend><label for="oisc">OISC registration number</label><input id="oisc"><label for="re">Email address</label><input id="re"></fieldset>
<div><label for="reason">Reason for applying</label><textarea id="reason"></textarea></div>
<div><label><input type="checkbox" id="decl"> I declare this is true</label></div>
<div><span id="swl">Receives benefits</span> <button type="button" role="switch" aria-checked="false" aria-labelledby="swl" id="sw"></button></div>
<fieldset><legend>Do you have dependants?</legend>
 <button type="button" aria-pressed="false" id="dy">Yes</button><button type="button" aria-pressed="false" id="dn">No</button></fieldset>
<script>
document.getElementById('sw').addEventListener('click',function(){var b=this;setTimeout(function(){b.setAttribute('aria-checked',b.getAttribute('aria-checked')==='true'?'false':'true')},30)});
['dy','dn'].forEach(function(id){document.getElementById(id).addEventListener('click',function(){document.getElementById('dy').setAttribute('aria-pressed',id==='dy');document.getElementById('dn').setAttribute('aria-pressed',id==='dn')})});
</script>
<input type="password" id="pw"><input type="hidden" id="hid">
<button type="button" id="submit">Continue</button>
</form></body></html>
